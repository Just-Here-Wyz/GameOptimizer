name: CI

# 触发面刻意收窄：
#   - main 的每次推送与 PR：日常regression
#   - v* tag：发布前再复核一遍，保证 tag 指向的源码本身是绿的
#   - 手动：想在不改代码的情况下重跑一次
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连推时取消上一次，不浪费 runner 分钟
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: 构建与测试（Windows x64）
    # Core 与 App 都是 net8.0-windows：Core 虽然不引用 WPF 类型，
    # 但目标框架带 -windows，Linux runner 上还原就会失败，所以必须用 Windows。
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore GameOptimizer.sln

      # Release 而不是 Debug：Debug 下 App 的 bin 常被正在运行的实例锁住，
      # 本地踩过 MSB3027；CI 上虽然干净，但用 Release 与真正出包的口径保持一致。
      - name: 构建
        run: dotnet build GameOptimizer.sln --no-restore --configuration Release

      - name: 运行测试
        run: >
          dotnet test GameOptimizer.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ runner.temp }}/test-results

      # 失败时把用例名直接写进 Actions 摘要。理由：trx 附件要登录才能下，
      # 控制台日志一屏几千行也翻不到关键那行；摘要页打开就能看见是哪条挂了。
      - name: 汇总失败用例
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'test-results'
          $trx = Get-ChildItem $dir -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) {
            Add-Content $env:GITHUB_STEP_SUMMARY '未找到 trx：测试可能根本没跑起来'
            exit 0
          }

          [xml]$doc = Get-Content $trx.FullName -Raw
          $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
          $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')

          $all = $doc.SelectNodes('//t:UnitTestResult', $ns)
          $bad = $doc.SelectNodes('//t:UnitTestResult[@outcome="failed"]', $ns)

          Add-Content $env:GITHUB_STEP_SUMMARY "## 测试结果：$($all.Count - $bad.Count) 通过 / 共 $($all.Count)"

          foreach ($f in $bad) {
            $first = ($f.Output.ErrorInfo.Message -split "`n")[0]
            Add-Content $env:GITHUB_STEP_SUMMARY "- **$($f.testName)** — $first"
          }

      # 失败时也要留档：没有 trx 就只能看控制台尾部，定位不到是哪一条挂的
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7
